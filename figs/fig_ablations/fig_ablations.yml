y:
  - kind: filt
    experiment: simulation_base
    metric: loss_db
    name: "Filter noise attenuation\n(simulation)"
    x:
      - method: F_nk
        name: "Neurokit"
      - method: F_bpd
        name: "Original priors"
      - method: F_bpd_RTZ_RSX
        name: "Uninformative time prior"
      - method: F_bpd_RTX_RSZ
        name: "Uninformative shape prior"
      - method: F_bpd_RTZ_RSZ
        name: "Both uninformative"
  - kind: time
    experiment: simulation_base
    metric: zp_rmse
    name: "Pulse interval RMSE\n(simulation)"
    log: True
    x:
      - method: F_pyp_T_pyp.u
        name: "PyPPG (U)"
      - method: T_bpd
        name: "Original priors"
      - method: T_bpd_RTZ_RSX
        name: "Uninformative time prior"
      - method: T_bpd_RTX_RSZ
        name: "Uninformative shape prior"
      - method: T_bpd_RTZ_RSZ
        name: "Both uninformative"
  - kind: shape
    experiment: simulation_base
    metric: h_errea
    name: "Pulse shape error\n(simulation)"
    log: True
    x:
      - method: F_pyp__F_pyp_T_pyp.u__S_avg
        name: "PyPPG (U)"
      - method: S_bpd
        name: "Original priors"
      - method: S_bpd_RTZ_RSX
        name: "Uninformative time prior"
      - method: S_bpd_RTX_RSZ
        name: "Uninformative shape prior"
      - method: S_bpd_RTZ_RSZ
        name: "Both uninformative"
  - kind: time
    experiment: aurora_ppg
    metric: zp_rmse
    name: "Pulse interval RMSE\n(human recordings)"
    log: True
    x:
      - method: F_pyp_T_pyp.u
        name: "PyPPG (U)"
      - method: T_bpd
        name: "Original priors"
      - method: T_bpd_RTZ_RSX
        name: "Uninformative time prior"
      - method: T_bpd_RTX_RSZ
        name: "Uninformative shape prior"
      - method: T_bpd_RTZ_RSZ
        name: "Both uninformative"
